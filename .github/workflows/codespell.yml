# Codespell configuration is within pyproject.toml
---
name: Codespell

on:
  push:
    branches: [ main ]
  # Every pull request, also one stacked on another: GitHub retargets it to main when the one below is merged, which
  # starts no workflow. The checks of its commit from before still count then.
  pull_request:

permissions:
  contents: read

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Annotate locations with typos
        uses: codespell-project/codespell-problem-matcher@v1
      - name: Codespell
        uses: codespell-project/actions-codespell@v2
        with:
          ignore_words_file: .codespellignore